name: Pruebas

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contenido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  pyodide:
    # Runs every mission in the real browser interpreter (WebAssembly). The full Pyodide
    # distribution (~350 MB) is cached between runs.
    runs-on: ubuntu-latest
    env:
      PYODIDE_VERSION: "0.28.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        id: pyodide-cache
        with:
          path: pyodide
          key: pyodide-full-${{ env.PYODIDE_VERSION }}
      - if: steps.pyodide-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o pyodide.tar.bz2 "https://github.com/pyodide/pyodide/releases/download/${PYODIDE_VERSION}/pyodide-${PYODIDE_VERSION}.tar.bz2"
          tar -xjf pyodide.tar.bz2 --exclude='*-tests.tar'
          rm pyodide.tar.bz2
      - run: npm ci
        working-directory: web
      - run: node scripts/validate-pyodide.mjs
        working-directory: web
        env:
          PYODIDE_DIST: ${{ github.workspace }}/pyodide
